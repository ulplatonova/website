<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>CleanHub — всё включено</title><style>
@font-face{font-family:Montserrat;font-weight:400;src:url(../assets/fonts/mont-400.ttf)}@font-face{font-family:Montserrat;font-weight:500;src:url(../assets/fonts/mont-500.ttf)}@font-face{font-family:Montserrat;font-weight:700;src:url(../assets/fonts/mont-700.ttf)}@font-face{font-family:Montserrat;font-weight:800;src:url(../assets/fonts/mont-800.ttf)}
:root{--g:#00b14f;--dg:#0b2517;--mint:#5fe39a}*{box-sizing:border-box;margin:0;padding:0}
.b{position:relative;width:640px;height:960px;overflow:hidden;background:#fff;font-family:Montserrat,Arial,sans-serif;color:var(--dg);padding:100px 44px 96px;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center}.top img{height:42px;mix-blend-mode:multiply}
.pill{border:2px solid var(--g);color:var(--g);border-radius:40px;padding:8px 28px;font-size:19px;font-weight:500}
.desc{font-size:24px;line-height:1.4}.desc b{font-weight:700}
.img{position:relative;border-radius:30px;background-size:cover;box-shadow:0 14px 30px rgba(11,37,23,.18)}
.badge{position:absolute;left:-14px;bottom:-30px;background:var(--g);color:#fff;border-radius:50px;padding:10px 34px 10px 30px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 22px rgba(0,177,79,.35)}
.badge{white-space:nowrap}.badge b{font-size:44px;font-weight:800;line-height:1}.badge span{font-size:22px;font-weight:500}
.ttl{margin-top:44px;text-align:center}
.ttl .a{font-size:56px;font-weight:800;color:var(--g);line-height:1.05}
.ttl .q{font-size:46px;font-weight:800;line-height:1.1;margin-top:6px}
.ttl svg{display:block;margin:2px auto 0;width:470px;height:26px}
.desc{margin-top:34px;text-align:center}
.ph{position:relative;margin-top:auto;height:360px}.ph .img{position:absolute;inset:0;background-image:url(photos/allinclusive.jpg);background-position:50% 50%}
.badge{left:50%;transform:translateX(-50%);bottom:-30px}
</style></head><body style="margin:0"><div class="b" id="banner">
<div class="top"><img src="../assets/logo.png" alt="CleanHub"><div class="pill">акция</div></div>
<div class="ttl"><div class="a">Скидка 15%</div><div class="q">«Всё включено»</div>
<svg viewBox="0 0 470 26" fill="none" stroke="#00b14f" stroke-width="5" stroke-linecap="round"><path d="M6 18C90 8 230 4 330 9c50 3 100 0 134-5M40 22c120-10 250-8 390-6"/></svg></div>
<p class="desc"><b>Пакетное предложение:</b><br>Генеральная + мытье всех окон<br>+ химчистка дивана</p>
<div class="ph"><div class="img"></div><div class="badge"><b>−15%</b><span>на весь пакет</span></div></div>
</div></body></html>
