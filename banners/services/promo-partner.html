<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>CleanHub — надежный партнер</title><style>
@font-face{font-family:Montserrat;font-weight:400;src:url(../assets/fonts/mont-400.ttf)}@font-face{font-family:Montserrat;font-weight:500;src:url(../assets/fonts/mont-500.ttf)}@font-face{font-family:Montserrat;font-weight:700;src:url(../assets/fonts/mont-700.ttf)}@font-face{font-family:Montserrat;font-weight:800;src:url(../assets/fonts/mont-800.ttf)}
:root{--g:#00b14f;--dg:#0b2517}*{box-sizing:border-box;margin:0;padding:0}
.b{position:relative;width:640px;height:960px;overflow:hidden;background:#fff;font-family:Montserrat,Arial,sans-serif;color:var(--dg);padding:100px 44px 96px;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center}.top img{height:42px;mix-blend-mode:multiply}
.pill{border:2px solid var(--g);color:var(--g);border-radius:40px;padding:8px 28px;font-size:19px;font-weight:500}
h1{margin-top:40px;font-size:46px;line-height:1.1;font-weight:800;color:var(--g);letter-spacing:-.01em}
.desc{margin-top:22px;font-size:24px;line-height:1.4;max-width:420px}.desc b{font-weight:700}
.card{position:relative;margin-top:auto;height:470px;border-radius:30px;overflow:hidden;background:linear-gradient(160deg,#eafaf1 0%,#c4f0d8 100%);box-shadow:0 14px 30px rgba(11,37,23,.14)}
.card .c1{position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;background:rgba(0,177,79,.16)}
.card .c2{position:absolute;left:-70px;bottom:40px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.55)}
.card img{position:absolute;left:50%;bottom:0;height:460px;transform:translateX(-50%)}
.badge{position:absolute;right:20px;top:24px;background:var(--g);color:#fff;border-radius:50px;padding:10px 24px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 22px rgba(0,177,79,.35);white-space:nowrap}
.badge b{font-size:38px;font-weight:800;line-height:1}.badge span{font-size:17px;font-weight:500;line-height:1.15}
</style></head><body style="margin:0"><div class="b" id="banner">
<div class="top"><img src="../assets/logo.png" alt="CleanHub"><div class="pill">о нас</div></div>
<h1>Ваш надежный партнер в чистоте</h1>
<p class="desc"><b>Более 10 лет</b> заботы о домах наших клиентов</p>
<div class="card"><div class="c1"></div><div class="c2"></div><img src="photos/partner.png" alt=""><div class="badge"><b>10+</b><span>лет заботы<br>о домах</span></div></div>
</div></body></html>
