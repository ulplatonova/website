<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>CleanHub — general</title>
<style>
@font-face{font-family:'Montserrat';font-weight:400;src:url(../assets/fonts/mont-400.ttf)}
@font-face{font-family:'Montserrat';font-weight:500;src:url(../assets/fonts/mont-500.ttf)}
@font-face{font-family:'Montserrat';font-weight:700;src:url(../assets/fonts/mont-700.ttf)}
@font-face{font-family:'Montserrat';font-weight:800;src:url(../assets/fonts/mont-800.ttf)}
:root{--g:#00b14f;--dg:#0b2517;--mint:#5fe39a;--cream:#ffffff}
*{box-sizing:border-box;margin:0;padding:0}
.b{position:relative;width:640px;height:960px;overflow:hidden;background:var(--cream);font-family:'Montserrat',Arial,sans-serif;color:var(--dg);padding:100px 44px 140px;display:flex;flex-direction:column}
.ring{position:absolute;right:-120px;top:-120px;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(95,227,154,.35),rgba(95,227,154,0) 70%)}
.top{position:relative;display:flex;justify-content:space-between;align-items:center}
.top img{height:42px;mix-blend-mode:multiply}
.pill{border:2px solid var(--g);color:var(--g);border-radius:40px;padding:8px 28px;font-size:19px;font-weight:500}
h1{position:relative;margin-top:40px;font-size:46px;line-height:1.1;font-weight:800;color:var(--g);letter-spacing:-.01em}
.desc{position:relative;margin-top:22px;font-size:24px;line-height:1.4;font-weight:400;max-width:552px}
.desc b{font-weight:700}
.ph{position:relative;margin-top:auto;height:350px;flex:none}
.ph .img{position:absolute;inset:0;border-radius:30px;background:url(photos/general.jpg) 30% 40%/cover;box-shadow:0 14px 30px rgba(11,37,23,.18)}
.price{position:absolute;left:-14px;bottom:-30px;background:var(--g);color:#fff;border-radius:50px;padding:12px 34px 12px 30px;display:flex;align-items:baseline;gap:10px;box-shadow:0 10px 22px rgba(0,177,79,.35)}
.price span{font-size:22px;font-weight:500}.price b{font-size:44px;font-weight:800;line-height:1}
.foot{position:relative;margin-top:52px;display:flex;justify-content:flex-end;font-size:15px;font-weight:500;opacity:.7}
</style></head><body style="margin:0">
<div class="b" id="banner">
 <div class="top"><img src="../assets/logo.png" alt="CleanHub"><div class="pill">услуга</div></div>
 <h1>Генеральная уборка квартир и домов</h1>
 <p class="desc"><b>Глубокая уборка</b> всех труднодоступных мест и помещений</p>
 <div class="ph"><div class="img"></div><div class="price"><span>от</span><b>8.990</b><span>руб.</span></div></div>
</div></body></html>
