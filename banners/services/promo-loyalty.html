<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>CleanHub — постоянным клиентам</title><style>
@font-face{font-family:Montserrat;font-weight:400;src:url(../assets/fonts/mont-400.ttf)}@font-face{font-family:Montserrat;font-weight:500;src:url(../assets/fonts/mont-500.ttf)}@font-face{font-family:Montserrat;font-weight:700;src:url(../assets/fonts/mont-700.ttf)}@font-face{font-family:Montserrat;font-weight:800;src:url(../assets/fonts/mont-800.ttf)}
:root{--g:#00b14f;--dg:#0b2517;--mint:#5fe39a}*{box-sizing:border-box;margin:0;padding:0}
.b{position:relative;width:640px;height:960px;overflow:hidden;background:#fff;font-family:Montserrat,Arial,sans-serif;color:var(--dg);padding:100px 44px 96px;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center}.top img{height:42px;mix-blend-mode:multiply}
.pill{border:2px solid var(--g);color:var(--g);border-radius:40px;padding:8px 28px;font-size:19px;font-weight:500}
.desc{font-size:24px;line-height:1.4}.desc b{font-weight:700}
.img{position:relative;border-radius:30px;background-size:cover;box-shadow:0 14px 30px rgba(11,37,23,.18)}
.badge{position:absolute;left:-14px;bottom:-30px;background:var(--g);color:#fff;border-radius:50px;padding:10px 34px 10px 30px;display:flex;align-items:baseline;gap:12px;box-shadow:0 10px 22px rgba(0,177,79,.35)}
.badge b{font-size:44px;font-weight:800;line-height:1}.badge span{font-size:22px;font-weight:500}
h1{margin-top:36px;font-size:46px;line-height:1.1;font-weight:800;color:var(--g);letter-spacing:-.01em}
.desc{margin-top:16px}
.desc svg{width:22px;height:22px;vertical-align:-3px}
.cards{margin-top:22px;display:flex;flex-direction:column;gap:12px}
.card{display:flex;align-items:center;gap:20px;border:2px solid #d9efe2;border-radius:24px;padding:10px 22px 10px 10px;background:#f6fcf8}
.pct{background:var(--g);color:#fff;border-radius:18px;font-size:42px;font-weight:800;line-height:1;padding:10px 18px;min-width:140px;text-align:center}
.card b{font-size:26px;font-weight:800}
.ph{margin-top:22px;height:190px;position:relative}.ph .img{position:absolute;inset:0;background-image:url(photos/loyal.jpg);background-position:70% 12%}
.note{margin-top:auto;font-size:12.5px;line-height:1.45;color:#4a5f53}
</style></head><body style="margin:0"><div class="b" id="banner">
<div class="top"><img src="../assets/logo.png" alt="CleanHub"><div class="pill">акция</div></div>
<h1>Нашим постоянным клиентам</h1>
<p class="desc"><b>Дарим скидки.</b>&nbsp;Спасибо, что вы с нами остаетесь&nbsp;<svg viewBox="0 0 24 24" fill="#00b14f"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.3 2.9 4.5 6.6 4.5c2 0 3.7 1.1 5.4 3 1.7-1.9 3.4-3 5.4-3 3.700 0 5.700 3.800 4.200 7.200C19.500 16.400 12 21 12 21z"/></svg></p>
<div class="cards">
<div class="card"><div class="pct">−10%</div><b>на второй заказ*</b></div>
<div class="card"><div class="pct">−15%</div><b>на третий заказ*</b></div></div>
<div class="ph"><div class="img"></div></div>
<p class="note">* Скидки распространяются только на генеральную уборку и уборку после ремонта.<br>* Чтобы получить скидку, сообщите об этом менеджеру.</p>
</div></body></html>
