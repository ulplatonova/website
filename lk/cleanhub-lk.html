<script>/*PRICING:BEGIN*/

  function clampQty(x, v) {

      lines: lines, extrasTotal: extrasTotal, approx: approx, hasQuote: hasQuote,

  }

      included: q.included,
      perks: q.individual ? [] : perksFor(svc, s.tariff, q.included),

      firstOrderAvailable: firstOrderApplies(s),

      upsell: null,

    r.total = r.subscription && !r.subscription.individual ? r.subscription.perMonth : q.oneTime;

    if (!q.individual) {

        });
        r.upsell = { tariff: best.id, title: tariffTitle(best.id), saving: q.oneTime - best.q.oneTime, covered: covered };
      }
    }
    return r;
  }

    subscription: SUBSCRIPTION,
    extras: EXTRAS,
    extraGroups: EXTRA_GROUPS,
    units: UNITS,
    plural: plural,
    money: money,
    unitLabel: unitLabel,
    normalize: normalize
  };
}));

<script>
(function(){
'use strict';
var root=document.getElementById('chlk');
if(!root||root.getAttribute('data-ready'))return;
root.setAttribute('data-ready','1');

/* ================= НАСТРОЙКИ ================= */
var CHLK_CONFIG=window.CHLK_CONFIG||{};
var C={
  mode:'demo',                          // 'demo' — тестовые данные; 'live' — работа с вашим сервером (lk/server)
  apiBase:'https://api.cleanhub24.ru/lk', // адрес сервера кабинета
  telegramBot:'cleanhub24_bot',         // имя Telegram-бота без @
  siteUrl:'https://cleanhub24.ru',
  slots:['09:00–11:00','11:00–13:00','13:00–15:00','15:00–17:00','17:00–19:00'],
  supportUrl:'https://t.me/cleanhub24_support',
  privacyUrl:'/privacy',
  referralOwnerBonus:500,               // только для демо: в боевом режиме суммы приходят с сервера
  referralFriendBonus:500,
  maxPayPercent:30,
  showDemoBar:true
};
for(var k in CHLK_CONFIG)C[k]=CHLK_CONFIG[k];

/* ================= УТИЛИТЫ ================= */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function digits(s){return String(s||'').replace(/\D/g,'')}
function fmtPhone(s){
  var d=digits(s);if(!d)return'';
  if(d[0]==='7'||d[0]==='8')d=d.slice(1);
  d=d.slice(0,10);
  var o='+7 ('+d.slice(0,3);
  if(d.length>=3)o+=')';
  if(d.length>3)o+=' '+d.slice(3,6);
  if(d.length>6)o+='-'+d.slice(6,8);
  if(d.length>8)o+='-'+d.slice(8,10);
  return o;
}
function phoneOk(s){var d=digits(s);if(d[0]==='7'||d[0]==='8')d=d.slice(1);return d.length===10}
function money(n){return Math.round(n).toLocaleString('ru-RU')+' ₽'}
function plural(n,f){n=Math.abs(n)%100;var m=n%10;return n>10&&n<20?f[2]:m>1&&m<5?f[1]:m===1?f[0]:f[2]}
function bonus(n){return Math.round(n).toLocaleString('ru-RU')+' '+plural(n,['бонус','бонуса','бонусов'])}
function dFmt(iso,long){var d=new Date(iso);return d.toLocaleDateString('ru-RU',long?{day:'numeric',month:'long',year:'numeric'}:{day:'numeric',month:'long'})}
var mem={};
var store={
  get:function(k){try{return localStorage.getItem(k)}catch(e){return mem[k]||null}},
  set:function(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}},
  del:function(k){try{localStorage.removeItem(k)}catch(e){delete mem[k]}}
};
function wait(v,ms){return new Promise(function(r){setTimeout(function(){r(v)},ms==null?350:ms)})}
function failP(m){return new Promise(function(_,rej){setTimeout(function(){rej(new Error(m))},350)})}

/* ================= ЦЕНЫ: тот же движок, что в калькуляторе на сайте (lk/pricing.js) ================= */
var PR=window.CleanHubPricing;
function extraPrice(x,svc){return x.priceBy&&x.priceBy[svc]!=null?x.priceBy[svc]:x.price}
function extraTitle(x,svc){return(x.titleBy&&x.titleBy[svc])||x.title}
function tariffId(t){for(var i=0;i<PR.tariffs.length;i++)if(PR.tariffs[i].title===t||PR.tariffs[i].id===t)return PR.tariffs[i].id;return PR.config.defaults.tariff}
function isoDate(d){var m=d.getMonth()+1,dd=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(dd<10?'0':'')+dd}
function fromISO(s){var p=String(s).slice(0,10).split('-');return new Date(+p[0],+p[1]-1,+p[2],12)}
function wd(d){return((d.getDay()+6)%7)+1}               // 1 = понедельник … 7 = воскресенье
function visitDates(startISO,weekday,freq,months,limit){  // даты уборок по подписке
  var d=fromISO(startISO),end=fromISO(startISO),out=[],step=freq===4?7:14;
  while(wd(d)!==weekday)d.setDate(d.getDate()+1);
  end.setMonth(end.getMonth()+months);
  while(d<end&&out.length<(limit||200)){out.push(isoDate(d));d.setDate(d.getDate()+step)}
  return out;
}

  function day(n){var d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+n);return d.toISOString()}
  function orderFromCalc(id,off,status,state,spent,slot,subId){
    var r=PR.compute(state),items=[{name:r.serviceTitle+(r.individual?'':', тариф «'+r.tariffTitle+'»')+', '+r.area+' м²',qty:1,price:r.base}];

      else if(l.paid>0)items.push({name:l.title+(l.included?' ('+l.included+' в тарифе)':''),qty:l.paid,price:Math.round(l.cost/l.paid)});
    });

    return{id:id,date:day(off),status:status,title:r.serviceTitle,tariff:r.individual?'':r.tariffTitle,area:r.area,svc:state.service,extras:state.extras||{},
      items:items,total:total,bonusSpent:spent,bonusEarned:status==='cancel'?0:Math.round(total*RATE),address:ADDR,slot:slot,comment:'',sub:subId||null};
  }
  function decorate(s){
    var t=isoDate(new Date());
    s.endDate=(function(){var e=fromISO(s.startDate);e.setMonth(e.getMonth()+s.months);return isoDate(e)})();
    s.nextVisits=s.status==='cancelled'||s.status==='finished'?[]:visitDates(s.startDate,s.weekday,s.freq,s.months).filter(function(d){return d>=t}).slice(0,4);
    return s;
  }
  function mkSub(st,weekday,slot,address,startISO,status,comment){
    var r=PR.compute({service:'support',area:st.area,tariff:st.tariff,freq:st.freq,months:st.months}),q=r.subscription;
    return decorate({id:'s_'+Math.random().toString(36).slice(2,8),status:status,service:'support',area:r.area,tariff:st.tariff,freq:st.freq,months:st.months,
      weekday:weekday,slot:slot,address:address,startDate:startISO,base:r.base,discountPerCleaning:q.discountPerCleaning,perCleaning:q.perCleaning,
      perMonth:q.perMonth,periodTotal:q.periodTotal,nextVisits:[],paymentUrl:null,comment:comment||'',createdAt:new Date().toISOString()});
  }
  function build(persona,phone,name,email){
    var user={id:'u1',name:name||(persona==='regular'?'Анна':''),phone:phone||'+7 (916) 123-45-67',email:email||(persona==='regular'?'anna@example.com':''),birthday:'',
      tg:{connected:false,username:''},notify:{tgOrders:true,tgPromo:false},
      addresses:persona==='regular'?[{id:'a1',label:'Дом',text:ADDR},{id:'a2',label:'Дача',text:'Московская обл., Подольск, ул. Лесная, 12'}]:[]};
    var orders=[],history=[],subs=[],invited=[];
    if(persona==='regular'){
      var st=new Date();st.setDate(st.getDate()-28);var startISO=isoDate(st);
      subs=[mkSub({area:53,tariff:'standard',freq:2,months:6},wd(st),'11:00–13:00',ADDR,startISO,'active')];
      var nv=subs[0].nextVisits[0];
      orders=[
        orderFromCalc('CH-10570',Math.round((fromISO(nv)-new Date())/864e5),'new',{service:'support',area:53,tariff:'standard'},0,'11:00–13:00',subs[0].id),
        orderFromCalc('CH-10566',1,'new',{service:'general',area:53,tariff:'standard',extras:{windows:3}},0,'10:00–12:00'),
        orderFromCalc('CH-10558',0,'work',{service:'support',area:53,tariff:'premium',extras:{fridge:1}},0,'14:00–16:00'),
        orderFromCalc('CH-10431',-21,'done',{service:'general',area:53,tariff:'lite'},300,'09:00–11:00'),
        orderFromCalc('CH-10317',-58,'done',{service:'support',area:53,tariff:'lite',extras:{balcony:1}},0,'16:00–18:00'),
        orderFromCalc('CH-10204',-97,'done',{service:'support',area:53,tariff:'standard',extras:{oven:1}},0,'10:00–14:00'),
        orderFromCalc('CH-10188',-110,'cancel',{service:'support',area:53,tariff:'lite'},0,'12:00–14:00')
      ];
      orders.slice().reverse().forEach(function(o){
        if(o.status!=='done')return;
        history.push({date:o.date,title:'Начисление за заказ '+o.id,delta:o.bonusEarned});
        if(o.bonusSpent)history.push({date:o.date,title:'Списание в заказе '+o.id,delta:-o.bonusSpent});
      });
      history.push({date:day(-40),title:'Бонус за друга: Мария К. сделала первый заказ',delta:C.referralOwnerBonus});
      invited=[{name:'Мария К.',status:'rewarded',date:day(-52),reward:C.referralOwnerBonus},{name:'Игорь П.',status:'ordered',date:day(-9),reward:0},{name:'Олег С.',status:'registered',date:day(-3),reward:0}];
    }
    history.sort(function(a,b){return new Date(b.date)-new Date(a.date)});
    return{persona:persona,user:user,orders:orders,history:history,subs:subs,invited:invited,promos:{},referredBy:''};
  }
  var D=null;
  try{D=JSON.parse(store.get('chlk_demo')||'null')}catch(e){}
  function save(){store.set('chlk_demo',JSON.stringify(D))}
  function loyalty(){
    var spent=0,bal=0;
    D.orders.forEach(function(o){if(o.status==='done')spent+=o.total});
    D.history.forEach(function(h){bal+=h.delta});
    return{clientNo:'CH-'+(D.persona==='regular'?'000123':'000481'),balance:bal,spent:spent,levels:LEVELS,expiring:null,history:D.history,maxPay:C.maxPayPercent};
  }
  function referral(){
    var code='CH-'+(D.persona==='regular'?'K7M2Q':'R4T9X'),earned=0,rewarded=0;
    D.invited.forEach(function(i){if(i.status==='rewarded'){rewarded++;earned+=i.reward}});
    return{code:code,link:C.siteUrl+'/?ref='+code,ownerBonus:C.referralOwnerBonus,friendBonus:C.referralFriendBonus,invited:D.invited,totals:{invited:D.invited.length,rewarded:rewarded,earned:earned}};
  }
  function login(persona,phone,name,email,ref){D=build(persona,phone,name,email);if(ref)D.referredBy=ref;save();store.set('chlk_token','demo')}
  var tgFlag={};
  return{
    quick:function(p){login(p);return wait(null,0)},
    reset:function(){D=null;store.del('chlk_demo');store.del('chlk_token')},
    sendCode:function(){return wait({ok:true})},
    verify:function(phone,code,reg){
      if(code!=='1234')return failP('Неверный код. В демо-режиме подходит код 1234.');
      var ref=reg&&/^CH-[A-Z0-9]{5}$/.test(reg.refCode||'')?reg.refCode:'';
      if(reg)login('new',phone,reg.name,reg.email,ref);else login('regular',phone);
      return wait({token:'demo',referralApplied:!!ref});
    },
    me:function(){return D?wait({user:D.user,loyalty:loyalty(),referral:referral()}):failP('Сессия истекла')},
    orders:function(){return wait(D?D.orders:[])},
    subs:function(){return wait(D?D.subs.map(decorate):[])},
    updateProfile:function(patch){
      for(var k in patch)D.user[k]=patch[k];
      save();return wait({user:D.user},250);
    },
    createOrder:function(pl){
      var st=pl.state,r=PR.compute(st),L=loyalty(),li=levelInfo(L);
      if(!pl.address||!String(pl.address).trim())return failP('Укажите адрес.');
      if(!pl.date)return failP('Выберите дату.');
      if(!(st.area>=1))return failP('Укажите площадь.');
      var maxB=Math.max(0,Math.min(L.balance,Math.floor(r.total*L.maxPay/100))),b=Math.max(0,Math.min(Math.round(pl.bonusSpend)||0,maxB));
      var id='CH-'+(10571+D.orders.length);
      var o=orderFromCalc(id,0,'new',st,b,pl.slot);
      o.date=new Date(pl.date+'T12:00:00').toISOString();o.address=pl.address;o.comment=pl.comment||'';
      o.bonusEarned=Math.round(o.total*li.cur.pct/100);
      D.orders.unshift(o);
      if(b)D.history.unshift({date:new Date().toISOString(),title:'Списание в заказе '+id,delta:-b});
      save();return wait({order:o},600);
    },
    createSub:function(pl){
      var st=pl.state,r=PR.compute({service:'support',area:st.area,tariff:st.tariff,freq:st.freq,months:st.months});
      if(!pl.address||!String(pl.address).trim())return failP('Укажите адрес.');
      if(r.individual||!r.subscription)return failP('Для такой площади стоимость подписки считаем индивидуально. Напишите нам в поддержку.');
      var s=mkSub(st,pl.weekday,pl.slot,pl.address,pl.startDate,'active',pl.comment);
      D.subs.unshift(s);save();return wait({subscription:s,paymentUrl:null},700);
    },
    subAction:function(id,action){
      var s=D.subs.filter(function(x){return x.id===id})[0];
      if(!s)return failP('Подписка не найдена.');
      var map={pause:['active','paused'],resume:['paused','active'],cancel:['active','cancelled']};
      if(action==='cancel'&&(s.status==='paused'||s.status==='pending_payment'))s.status='cancelled';
      else if(map[action]&&s.status===map[action][0])s.status=map[action][1];
      else return failP('Это действие сейчас недоступно.');
      save();return wait({subscription:decorate(s)},400);
    },
    promo:function(code){
      code=String(code||'').trim().toUpperCase();
      if(D.promos[code])return failP('Этот промокод уже использован.');
      if(code==='WELCOME200'){D.promos[code]=1;D.history.unshift({date:day(0),title:'Промокод '+code,delta:200});save();return wait({ok:true})}
      if(/^CH-[A-Z0-9]{5}$/.test(code)&&code!==referral().code){
        if(D.referredBy)return failP('Промокод друга уже применён.');
        if(D.orders.some(function(o){return o.status==='done'}))return failP('Промокод друга действует только до первой уборки.');
        D.referredBy=code;D.promos[code]=1;save();return wait({ok:true});
      }
      return failP('Промокод не найден. В демо подходят WELCOME200 и коды друзей вида CH-XXXXX.');
    },
    tgLink:function(){tgFlag.link=false;return wait({url:'https://t.me/'+C.telegramBot+'?start=demo-link',token:'demo-link'})},
    tgStatus:function(){

    tgUnlink:function(){D.user.tg={connected:false,username:''};save();return wait({ok:true},250)},
    tgAuthStart:function(){tgFlag.auth=false;return wait({url:'https://t.me/'+C.telegramBot+'?start=demo-login',token:'demo-auth'})},
    tgAuthStatus:function(){
      if(tgFlag.auth){login('regular');D.user.tg={connected:true,username:'anna_k'};save();return wait({done:true,token:'demo'},150)}
      return wait({done:false},150);
    },
    demoConfirm:function(kind){tgFlag[kind]=true},
    logout:function(){D=null;store.del('chlk_demo')}
  };
}

/* ================= API: БОЕВОЙ РЕЖИМ ================= */
function liveApi(){
  function req(path,method,body){
    var h={'Content-Type':'application/json'},t=store.get('chlk_token');
    if(t)h.Authorization='Bearer '+t;
    return fetch(C.apiBase+path,{method:method||'GET',headers:h,body:body?JSON.stringify(body):undefined,credentials:'omit'})
      .then(function(r){return r.json().catch(function(){return{}}).then(function(j){
        if(r.status===401&&path!=='/auth/verify'){store.del('chlk_token')}
        if(!r.ok)throw new Error(j.message||'Не удалось выполнить запрос. Попробуйте ещё раз.');
        return j;
      })});
  }
  return{
    sendCode:function(phone,purpose){return req('/auth/code','POST',{phone:phone,purpose:purpose})},
    verify:function(phone,code,reg){return req('/auth/verify','POST',{phone:phone,code:code,profile:reg||null})},
    me:function(){return req('/me')},
    orders:function(){return req('/orders').then(function(j){return j.orders||j})},
    updateProfile:function(p){return req('/me','PATCH',p)},
    createOrder:function(pl){return req('/orders','POST',pl).then(function(j){return j.order?j:{order:j}})},
    subs:function(){return req('/subscriptions').then(function(j){return j.subscriptions||[]})},
    createSub:function(pl){return req('/subscriptions','POST',pl)},
    subAction:function(id,a){return req('/subscriptions/'+encodeURIComponent(id),'PATCH',{action:a})},
    promo:function(code){return req('/loyalty/promo','POST',{code:code})},
    tgLink:function(){return req('/telegram/link','POST')},
    tgStatus:function(t){return req('/telegram/status?token='+encodeURIComponent(t))},
    tgUnlink:function(){return req('/telegram','DELETE')},
    tgAuthStart:function(){return req('/auth/telegram/start','POST')},
    tgAuthStatus:function(t){return req('/auth/telegram/status?token='+encodeURIComponent(t))},
    logout:function(){}
  };
}

function levelInfo(L){
  var cur=L.levels[0],next=null;
  for(var i=0;i<L.levels.length;i++){if(L.spent>=L.levels[i].from){cur=L.levels[i];next=L.levels[i+1]||null}}
  var pct=next?Math.min(100,Math.round((L.spent-cur.from)/(next.from-cur.from)*100)):100;
  return{cur:cur,next:next,pct:pct};
}

function loyaltyHero(){
  var L=S.loy,li=levelInfo(L);
  var prog=li.next
    ?'<div class="k-prog" role="progressbar" aria-valuenow="'+li.pct+'" aria-valuemin="0" aria-valuemax="100"><i style="width:'+li.pct+'%"></i></div><p class="k-sub">Ещё '+money(li.next.from-L.spent)+' до статуса «'+esc(li.next.name)+'», кешбэк '+li.next.pct+'%</p>'
    :'<div class="k-prog"><i style="width:100%"></i></div><p class="k-sub">У вас высший статус: максимальный кешбэк</p>';
  return'<section class="k-loy" aria-label="Бонусная карта">'+
    '<div><span class="k-lvl'+(li.next?'':' top')+'">'+ic('star',14)+' '+esc(li.cur.name)+' · кешбэк '+li.cur.pct+'%</span>'+
    '<div class="k-bal">'+Math.round(L.balance).toLocaleString('ru-RU')+' <small>'+plural(L.balance,['бонус','бонуса','бонусов'])+'</small></div><p class="k-sub">1 бонус = 1 ₽. Можно оплатить до '+L.maxPay+'% заказа.</p>'+
    (L.expiring?'<div class="k-burn">Сгорит '+bonus(L.expiring.amount)+' — '+dFmt(L.expiring.date)+'</div>':'')+'</div>'+
    '<div><p class="k-sub">Потрачено на услуги</p><b class="k-num" style="font-size:24px">'+money(L.spent)+'</b>'+prog+
    '<div class="k-card-no"><span><span style="opacity:.75;font-weight:500;letter-spacing:0">№ клиента </span>'+esc(L.clientNo)+'</span><button data-act="copy" data-v="'+esc(L.clientNo)+'" aria-label="Скопировать номер клиента">'+ic('copy',16)+'</button></div></div></section>';
}

function orderHead(o){
  var st=STATUS[o.status]||STATUS.new;
  return'<button class="k-ohead" data-act="toggle-order" data-id="'+esc(o.id)+'" aria-expanded="'+!!S.open[o.id]+'">'+
    '<span><b>'+esc(o.title)+'</b><span class="k-muted k-small">№ '+esc(o.id)+' · '+dFmt(o.date)+(o.sub?' · по подписке':'')+'</span></span>'+
    '<span class="k-ototal k-num">'+money(o.total)+'</span><span class="k-chip '+st.c+'">'+st.t+'</span><span class="k-chev">'+ic('chev',18)+'</span></button>';
}
function orderBody(o){
  var rows=o.items.map(function(i){return'<tr><td>'+esc(i.name)+(i.qty>1?' × '+i.qty:'')+'</td><td class="k-num">'+(i.price?money(i.qty*i.price):'по фото')+'</td></tr>'}).join('');
  if(o.bonusSpent)rows+='<tr><td>Оплачено бонусами</td><td class="k-num">−'+money(o.bonusSpent)+'</td></tr>';
  rows+='<tr class="k-sum"><td>Итого</td><td class="k-num">'+money(o.total)+'</td></tr>';
  var steps='';
  if(o.status==='new'||o.status==='work'){
    var i=o.status==='new'?0:1;
    steps='<div class="k-steps">'+['Принят','В работе','Выполнен'].map(function(t,n){return'<div class="'+(n<=i?'on':'')+'">'+t+'</div>'}).join('')+'</div>';
  }
  var earn=o.status==='cancel'?'':'<div><dt>Бонусы</dt><dd class="k-plus">+'+bonus(o.bonusEarned)+(o.status==='done'?'':' после выполнения')+'</dd></div>';
  return'<div class="k-obody">'+steps+'<dl class="k-meta"><div><dt>Адрес</dt><dd>'+esc(o.address)+'</dd></div><div><dt>Время</dt><dd>'+dFmt(o.date)+', '+esc(o.slot)+'</dd></div>'+(o.area?'<div><dt>Площадь</dt><dd>'+o.area+'\u00A0м²</dd></div>':'')+(o.tariff?'<div><dt>Тариф</dt><dd>'+esc(o.tariff)+'</dd></div>':'')+earn+'</dl>'+
    '<table class="k-items"><tbody>'+rows+'</tbody></table>'+
    '<div class="k-row" style="margin-top:14px">'+(o.sub?'':'<button class="k-btn k-sm" data-act="repeat" data-id="'+esc(o.id)+'">'+ic('repeat',16)+' Повторить заказ</button>')+
    '<a class="k-btn k-ghost k-sm" href="'+esc(C.supportUrl)+'" target="_blank" rel="noopener">Вопрос по заказу</a></div></div>';
}

/* ---------- общие поля адреса для заказа (p='f') и подписки (p='s') ---------- */
function addrFields(p,f){
  var u=S.user;
  var sel=u.addresses.length?'<div class="k-field"><label for="chlk-'+p+'-addr">Адрес</label><select id="chlk-'+p+'-addr" class="k-in" data-bind="'+p+'.addrId">'+u.addresses.map(function(a){return'<option value="'+esc(a.id)+'"'+(f.addrId===a.id?' selected':'')+'>'+esc(a.label)+': '+esc(a.text)+'</option>'}).join('')+'<option value="other"'+(f.addrId==='other'?' selected':'')+'>Другой адрес…</option></select></div>':'';
  var inp=(!u.addresses.length||f.addrId==='other')?'<div class="k-field"><label for="chlk-'+p+'-addrtext">'+(u.addresses.length?'Новый адрес':'Адрес')+'</label><input id="chlk-'+p+'-addrtext" class="k-in" placeholder="Город, улица, дом, квартира" autocomplete="street-address" data-bind="'+p+'.addrText" value="'+esc(f.addrText)+'"></div>':'';

function resolveAddr(f){var u=S.user;return(!u.addresses.length||f.addrId==='other')?f.addrText.trim():((u.addresses.filter(function(a){return a.id===f.addrId})[0]||{}).text||'')}
function slotOptions(cur){return C.slots.map(function(t){return'<option'+(t===cur?' selected':'')+'>'+t+'</option>'}).join('')}
function tomorrow(){var t=new Date();t.setDate(t.getDate()+1);return t}
function lastArea(){var a=PR.config.defaults.area;for(var i=0;i<S.orders.length;i++){if(S.orders[i].area){a=S.orders[i].area;break}}return a}

/* ---------- тарифы и допуслуги: те же, что в калькуляторе ---------- */
function tariffsHtml(st,r){
  if(r.individual)return'<p class="k-muted k-small">Для такой площади считаем индивидуально: от '+r.perM2+' ₽ за м². Менеджер уточнит точную цену перед выездом.</p>';
  var svc=PR.services[st.service];
  return'<div class="k-tars">'+PR.tariffs.map(function(t){
    var inc=(svc.includes&&svc.includes[t.id])||{},perks=(svc.perks[t.id]||[]).map(function(p){
      var w=inc.windows;return p.replace('{windows}',Array.isArray(w)?w[r.tierIndex]:w);
    });
    return'<button type="button" class="k-tar" data-act="pick-tariff" data-v="'+t.id+'" aria-pressed="'+(st.tariff===t.id)+'"><b>'+esc(t.title)+'</b><span class="k-tp k-num">'+money(r.tariffPrices[t.id])+'</span><span class="k-muted k-small">'+esc(perks.length?'Входит: '+perks.join(', '):'Базовая уборка')+'</span></button>';
  }).join('')+'</div>';
}
function extrasHtml(f){
  return PR.extraGroups.map(function(g){
    var list=PR.extras.filter(function(x){return x.group===g.id});
    var n=list.filter(function(x){return f.extras[x.id]}).length,open=!!S.grpOpen[g.id];
    var rows=list.map(function(x){
      var p=extraPrice(x,f.service),qty=f.extras[x.id]||0;
      var price=p==null?'по фото':(x.from?'от ':'')+money(p)+(x.unit&&!x.toggle?' / '+PR.units[x.unit].short:'');
      var ctl=x.toggle
        ?'<label class="k-sw"><input type="checkbox" data-bind="f.ex.'+x.id+'"'+(qty?' checked':'')+' aria-label="'+esc(extraTitle(x,f.service))+'"><span></span></label>'
        :'<div class="k-step"><button type="button" data-act="qty" data-id="'+x.id+'" data-d="-1" aria-label="Меньше">−</button><b data-qty="'+x.id+'">'+qty+'</b><button type="button" data-act="qty" data-id="'+x.id+'" data-d="1" aria-label="Больше">+</button></div>';
      return'<div class="k-xrow"><div class="k-xt"><b>'+esc(extraTitle(x,f.service))+'</b><span class="k-muted k-small">'+esc(x.desc)+' · '+price+'</span></div>'+ctl+'</div>';
    }).join('');
    return'<div class="k-grp'+(open?' open':'')+'"><button type="button" data-act="grp" data-id="'+g.id+'" aria-expanded="'+open+'"><span>'+esc(g.title)+'<span class="k-muted" data-gcount="'+g.id+'">'+(n?' · выбрано '+n:'')+'</span></span><span class="k-chev">'+ic('chev',18)+'</span></button><div class="k-grp-body">'+rows+'</div></div>';
  }).join('');
}

/* ---------- заказ ---------- */
function formDefaults(from){
  var u=S.user,area=lastArea();
  S.lastArea=area;
  var f={service:'general',tariff:PR.config.defaults.tariff,area:area,extras:{},date:isoDate(tomorrow()),slot:C.slots[1],comment:'',useBonus:false,bonus:0,
    addrId:u.addresses.length?u.addresses[0].id:'other',addrText:''};
  if(from){
    if(from.svc&&PR.services[from.svc]){f.service=from.svc;f.area=from.area||f.area;f.tariff=tariffId(from.tariff);f.extras=JSON.parse(JSON.stringify(from.extras||{}))}
    if(from.slot&&C.slots.indexOf(from.slot)>=0)f.slot=from.slot;
    var m=u.addresses.filter(function(a){return a.text===from.address})[0];
    if(m)f.addrId=m.id;else{f.addrId='other';f.addrText=from.address||''}
  }
  return f;
}
function formQuote(){
  var f=S.form,r=PR.compute({service:f.service,area:f.area,tariff:f.tariff,extras:f.extras}),L=S.loy,li=levelInfo(L);
  var q={r:r,valid:f.area>=1,total:r.total};
  q.maxBonus=Math.max(0,Math.min(L.balance,Math.floor(q.total*L.maxPay/100)));
  q.bonus=f.useBonus?Math.min(Math.max(0,Math.round(f.bonus)||0),q.maxBonus):0;
  q.pay=q.total-q.bonus;q.pct=li.cur.pct;q.earn=Math.round(q.pay*q.pct/100);
  return q;
}

}

/* ---------- друзья и реферальная программа ---------- */
function refText(){var R=S.ref;return'Рекомендую CleanHub: клининг, которому я доверяю. По моему промокоду '+R.code+' вы получите '+bonus(R.friendBonus)+' после первой уборки.'}
function referralCard(){
  var R=S.ref,link=encodeURIComponent(R.link),txt=encodeURIComponent(refText());
  var refst={registered:['Зарегистрировался','blue'],ordered:['Ждём первую уборку','warn'],rewarded:['Бонусы начислены','ok']};
  var list=R.invited.length?'<ul class="k-hist">'+R.invited.map(function(i){var st=refst[i.status]||refst.registered;return'<li><span>'+esc(i.name)+'<br><span class="k-muted k-small">'+dFmt(i.date,true)+'</span></span><span class="k-row" style="gap:8px;flex-wrap:nowrap"><span class="k-chip '+st[1]+'">'+st[0]+'</span>'+(i.reward?'<b class="k-plus k-num">+'+i.reward.toLocaleString('ru-RU')+'</b>':'')+'</span></li>'}).join('')+'</ul>':'<p class="k-muted">Пока никого. Отправьте промокод другу, и здесь появится его статус.</p>';
  return'<div class="k-card k-ref" id="chlk-friends"><div class="k-grid k-refgrid"><div class="k-stack" style="gap:14px"><div><h3 style="margin:0 0 6px;font-size:20px">Приведи друга: по '+bonus(R.ownerBonus)+' вам обоим</h3>'+
    '<p class="k-muted">Отправьте друзьям свой промокод. Когда друг сделает первую уборку, вы получите '+bonus(R.ownerBonus)+', а друг '+bonus(R.friendBonus)+'.</p></div>'+
    '<div class="k-refcode"><span class="k-num">'+esc(R.code)+'</span><button class="k-btn k-sm" data-act="copy" data-v="'+esc(R.code)+'">'+ic('copy',16)+' Скопировать</button></div>'+
    '<div class="k-row" style="gap:8px"><span class="k-small k-muted" style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1">'+esc(R.link)+'</span><button class="k-link k-small" data-act="copy" data-v="'+esc(R.link)+'">Скопировать ссылку</button></div>'+
    '<div class="k-share">'+(navigator.share?'<button class="k-btn k-sm" data-act="share">'+ic('gift',16)+' Поделиться</button>':'')+
      '<a class="k-btn k-tg k-sm" target="_blank" rel="noopener" href="https://t.me/share/url?url='+link+'&text='+txt+'">'+ic('tg',16)+' Telegram</a>'+
      '<a class="k-btn k-ghost k-sm" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent(refText()+' '+R.link)+'">WhatsApp</a>'+
      '<a class="k-btn k-ghost k-sm" target="_blank" rel="noopener" href="https://vk.com/share.php?url='+link+'&title='+txt+'">VK</a></div></div>'+
    '<div class="k-stack" style="gap:14px"><div class="k-stats"><div class="k-stat"><b>'+R.totals.invited+'</b><span class="k-muted k-small">приглашено</span></div><div class="k-stat"><b>'+R.totals.rewarded+'</b><span class="k-muted k-small">сделали заказ</span></div><div class="k-stat"><b>'+R.totals.earned.toLocaleString('ru-RU')+'</b><span class="k-muted k-small">бонусов получено</span></div></div>'+list+'</div></div></div>';
}

function appView(){
  var u=S.user;
  var tabs=[['overview','grid','Обзор'],['orders','bag','Заказы'],['subs','repeat','Подписка'],['bonuses','star','Бонусы'],['profile','user','Профиль']];
  var nav=tabs.map(function(t){return'<button role="tab" data-act="tab" data-v="'+t[0]+'" aria-selected="'+(S.tab===t[0])+'">'+ic(t[1],18)+t[2]+'</button>'}).join('');
  if(S.tab==='order'&&!S.form)S.form=formDefaults();
  var body={overview:overviewTab,orders:ordersTab,bonuses:bonusesTab,profile:profileTab,order:orderView,subs:subsTab}[S.tab]();
  return'<div class="k-top"><div class="k-hello"><h2>Здравствуйте'+(u.name?', '+esc(u.name):'')+'!</h2><p class="k-muted">'+esc(u.phone)+'</p></div>'+
    '<div class="k-row"><div class="k-tabs" role="tablist">'+nav+'</div><button class="k-btn k-new" data-act="new-order">'+ic('plus',18)+' Заказать уборку</button><button class="k-btn k-ghost k-out" data-act="logout" aria-label="Выйти" title="Выйти">'+ic('out',18)+'</button></div></div>'+body;
}

/* ================= ДЕЙСТВИЯ ================= */
function toast(msg,kind){
  var old=document.querySelector('.k-toast');if(old)old.remove();
  var t=document.createElement('div');t.className='k-toast'+(kind?' '+kind:'');t.setAttribute('role','status');t.textContent=msg;
  root.appendChild(t);setTimeout(function(){if(t.parentNode)t.remove()},2800);
}
function fail(e){
  S.busy=false;var m=(e&&e.message)||'Что-то пошло не так. Попробуйте ещё раз.';
  if(S.view==='auth'){S.err=m;render()}else{render();toast(m,'bad')}
}
function stopTimers(){clearInterval(T.poll);clearInterval(T.resend)}
function tickResend(restart){
  var el=root.querySelector('[data-resend]');if(!el)return;
  if(restart){clearInterval(T.resend);if(T.left<=0)T.left=30;
    T.resend=setInterval(function(){T.left--;tickResend(false);if(T.left<=0)clearInterval(T.resend)},1000)}
  var cur=root.querySelector('[data-resend]');if(!cur)return;
  cur.innerHTML=T.left>0?'Повторно отправить код можно через '+T.left+' с':'<button class="k-link" data-act="resend">Отправить код ещё раз</button>';
}
function applyMe(m){
  S.user=m.user;S.loy=m.loyalty;
  S.ref=m.referral||{code:'',link:C.siteUrl,ownerBonus:C.referralOwnerBonus,friendBonus:C.referralFriendBonus,invited:[],totals:{invited:0,rewarded:0,earned:0}};
  S.user.notify=S.user.notify||{tgOrders:true,tgPromo:false};S.user.addresses=S.user.addresses||[];
}
var lastRefresh=0;
/* Подтягивает свежие данные из Битрикса (новые сделки, смена статусов) при заходе на вкладки. В демо не нужно. */
function refreshData(){
  if(DEMO||Date.now()-lastRefresh<8000)return;
  lastRefresh=Date.now();
  var tab=S.tab;
  Promise.all([API.me(),API.orders(),API.subs()]).then(function(r){
    if(S.view!=='app'||S.tab!==tab||S.confirm)return;
    var a=document.activeElement,typing=a&&root.contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName);
    applyMe(r[0]);S.orders=r[1]||[];S.subs=r[2]||[];
    if(!typing)render();
  }).catch(function(){});
}
function enterApp(){
  S.busy=true;lastRefresh=Date.now();
  return Promise.all([API.me(),API.orders(),API.subs()]).then(function(r){
    applyMe(r[0]);S.orders=r[1]||[];S.subs=r[2]||[];
    S.draft={name:S.user.name||'',email:S.user.email||'',birthday:S.user.birthday||''};
    S.view='app';S.tab='overview';S.busy=false;S.err='';S.step='form';S.tg=null;render();
  });
}
function sendCode(){
  var reg=S.authTab==='reg';S.err='';
  if(reg&&!S.name.trim()){S.err='Укажите, как к вам обращаться.';return render()}
  if(!phoneOk(S.phone)){S.err='Введите номер телефона полностью.';return render()}
  if(reg&&!S.agree){S.err='Нужно согласие на обработку персональных данных.';return render()}
  S.busy=true;render();
  API.sendCode(S.phone,reg?'register':'login').then(function(){S.busy=false;S.step='code';S.code='';T.left=30;S.focus='#chlk-code';render()}).catch(fail);
}
function verify(){
  if(S.code.length<4){S.err='Введите 4 цифры из SMS.';return render()}
  S.busy=true;S.err='';render();
  var reg=S.authTab==='reg'?{name:S.name.trim(),email:S.email.trim(),refCode:(S.refCode||'').trim()}:null;
  API.verify(S.phone,S.code,reg).then(function(r){if(r&&r.token)store.set('chlk_token',r.token);if(reg)store.del('chlk_ref');return enterApp().then(function(){if(r&&r.referralApplied)toast('Промокод друга применён: бонусы придут после вашей первой уборки')})}).catch(function(e){S.code='';S.focus='#chlk-code';fail(e)});
}
function startPoll(kind){
  clearInterval(T.poll);var n=0,tok=S.tg.token;
  T.poll=setInterval(function(){
    n++;if(n>150||!S.tg){clearInterval(T.poll);if(S.tg){S.tg=null;render()}return}
    (kind==='auth'?API.tgAuthStatus(tok):API.tgStatus(tok)).then(function(r){
      if(!S.tg)return;
      if(kind==='auth'&&r.done){clearInterval(T.poll);if(r.token)store.set('chlk_token',r.token);S.tg=null;enterApp()}
      if(kind==='link'&&r.connected){clearInterval(T.poll);S.tg=null;API.me().then(function(m){applyMe(m);render();toast('Telegram подключён')})}
    }).catch(function(){});
  },DEMO?1000:3000);
}
function logout(){stopTimers();API.logout();store.del('chlk_token');S=freshState();S.view='auth';render()}
function copy(v){
  var done=function(){toast('Скопировано')};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(v).then(done,function(){toast('Не удалось скопировать: '+v)});
  else toast(v);
}
function saveProfile(){
  S.busy=true;render();
  API.updateProfile({name:S.draft.name.trim(),email:S.draft.email.trim(),birthday:S.draft.birthday}).then(function(r){S.busy=false;if(r&&r.user)S.user=r.user;else{S.user.name=S.draft.name;S.user.email=S.draft.email}render();toast('Данные сохранены')}).catch(fail);
}

root.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el||!root.contains(el))return;
  var a=el.getAttribute('data-act'),v=el.getAttribute('data-v'),id=el.getAttribute('data-id');
  switch(a){
    case'auth-tab':S.authTab=v;S.err='';render();break;
    case'send-code':case'resend':sendCode();break;
    case'edit-phone':S.step='form';S.err='';clearInterval(T.resend);S.focus='#chlk-phone';render();break;
    case'verify':verify();break;
    case'tg-login':S.err='';API.tgAuthStart().then(function(r){S.tg={kind:'auth',url:r.url,token:r.token};render();startPoll('auth')}).catch(fail);break;
    case'tg-connect':S.busy=true;render();API.tgLink().then(function(r){S.busy=false;S.tg={kind:'link',url:r.url,token:r.token};render();startPoll('link')}).catch(fail);break;
    case'tg-cancel':clearInterval(T.poll);S.tg=null;render();break;
    case'tg-sim':API.demoConfirm(v);break;
    case'tg-unlink':API.tgUnlink().then(function(){S.user.tg={connected:false,username:''};render();toast('Telegram отключён')}).catch(fail);break;
    case'demo-quick':API.quick(v).then(enterApp).catch(fail);break;
    case'demo-reset':stopTimers();API.reset();S.view='auth';S.tg=null;render();break;
    case'tab':S.tab=v;if(v!=='order')S.done=null;if(v!=='subs')S.subDone=null;render();if(v!=='order'&&v!=='profile')refreshData();break;
    case'new-order':S.done=null;S.form=formDefaults();S.tab='order';render();root.scrollIntoView({behavior:'smooth',block:'start'});break;
    case'repeat':var src=S.orders.filter(function(x){return x.id===id})[0];S.done=null;S.form=formDefaults(src);S.tab='order';render();root.scrollIntoView({behavior:'smooth',block:'start'});toast(src&&src.svc?'Данные прошлого заказа подставлены':'Проверьте детали заказа');break;
    case'pick-svc':S.form.service=v;render();break;
    case'pick-tariff':if(S.tab==='subs'){S.sform.tariff=v;refreshSub()}else{S.form.tariff=v;refreshForm()}break;
    case'qty':var xx=PR.extras.filter(function(q){return q.id===id})[0],nv=Math.max(0,Math.min(xx.max||99,(S.form.extras[id]||0)+Number(el.getAttribute('data-d'))));if(nv)S.form.extras[id]=nv;else delete S.form.extras[id];var qe=root.querySelector('[data-qty="'+id+'"]');if(qe)qe.textContent=nv;refreshForm();break;
    case'grp':S.grpOpen[id]=!S.grpOpen[id];el.closest('.k-grp').classList.toggle('open',!!S.grpOpen[id]);el.setAttribute('aria-expanded',!!S.grpOpen[id]);break;
    case'submit-order':submitOrder();break;
    case'new-sub':S.sform=sformDefaults();S.subNew=true;S.subDone=null;render();break;
    case'sub-close':S.subDone=null;render();break;
    case'pick-freq':S.sform.freq=Number(v);render();break;
    case'pick-term':S.sform.months=Number(v);render();break;
    case'submit-sub':submitSub();break;
    case'sub-ask':S.confirm=id;render();break;
    case'sub-no':S.confirm=null;render();break;
    case'sub-do':S.confirm=null;API.subAction(id,v).then(function(r){S.subs=S.subs.map(function(x){return x.id===id?r.subscription:x});render();toast(v==='pause'?'Подписка поставлена на паузу':v==='resume'?'Подписка возобновлена':'Подписка отменена')}).catch(fail);break;
    case'share':try{navigator.share({title:'CleanHub',text:refText(),url:S.ref.link}).catch(function(){})}catch(e){}break;
    case'goto-friends':S.tab='bonuses';render();var fe=root.querySelector('#chlk-friends');if(fe)fe.scrollIntoView({behavior:'smooth',block:'start'});break;
    case'filter':S.filter=v;render();break;
    case'toggle-order':S.open[id]=!S.open[id];render();break;
    case'open-order':S.tab='orders';S.open[id]=true;render();break;
    case'copy':copy(v);break;
    case'save-profile':saveProfile();break;
    case'add-addr':
      if(!S.newAddr.trim()){toast('Введите адрес','bad');break}
      var list=S.user.addresses.concat([{id:'a'+Date.now(),label:'Адрес '+(S.user.addresses.length+1),text:S.newAddr.trim()}]);
      API.updateProfile({addresses:list}).then(function(r){S.user.addresses=(r&&r.user&&r.user.addresses)||list;S.newAddr='';render();toast('Адрес добавлен')}).catch(fail);break;
    case'del-addr':
      var rest=S.user.addresses.filter(function(x){return x.id!==id});
      API.updateProfile({addresses:rest}).then(function(r){S.user.addresses=(r&&r.user&&r.user.addresses)||rest;render()}).catch(fail);break;
    case'promo':
      if(!S.promo.trim()){toast('Введите промокод','bad');break}
      S.busy=true;render();
      API.promo(S.promo).then(function(){S.promo='';return API.me()}).then(function(m){S.busy=false;applyMe(m);render();toast('Промокод принят')}).catch(fail);break;
    case'logout':logout();break;
  }
});
var NUM={'f.area':1,'f.bonus':1,'s.area':1,'s.weekday':1};
function onSubChange(b){if(b==='s.addrId'){render();return}refreshSub()}
root.addEventListener('input',function(e){
  var el=e.target,b=el.getAttribute&&el.getAttribute('data-bind');if(!b)return;
  if(b.indexOf('f.ex.')===0){var xid=b.slice(5);if(el.checked)S.form.extras[xid]=1;else delete S.form.extras[xid];refreshForm();return}
  var val=el.type==='checkbox'?el.checked:el.value;
  if(b==='phone'){val=fmtPhone(val);el.value=val}
  if(b==='code'){val=digits(val).slice(0,4);el.value=val}
  if(b==='refCode'){val=val.toUpperCase();el.value=val}
  if(NUM[b])val=Number(val)||0;
  var m=b.match(/^([fds])\.(.+)$/);
  if(m){({f:S.form,d:S.draft,s:S.sform})[m[1]][m[2]]=val;if(m[1]==='f')onFormChange(b);if(m[1]==='s')onSubChange(b);return}
  S[b]=val;
  if(b==='code'&&val.length===4&&!S.busy)verify();
});
root.addEventListener('change',function(e){
  var el=e.target,k=el.getAttribute&&el.getAttribute('data-sw');if(!k)return;
  S.user.notify[k]=el.checked;
  API.updateProfile({notify:S.user.notify}).then(function(){toast('Сохранено')}).catch(function(err){el.checked=!el.checked;S.user.notify[k]=el.checked;toast(err.message,'bad')});
});
root.addEventListener('keydown',function(e){
  if(e.key!=='Enter'||e.target.tagName!=='INPUT'||e.target.type==='checkbox')return;
  if(S.view==='auth'&&S.step==='form')sendCode();
  else if(S.view==='auth'&&S.step==='code')verify();
});

/* ================= СТАРТ ================= */
render();
if(store.get('chlk_token')){enterApp().catch(function(){store.del('chlk_token');S.view='auth';S.busy=false;render()})}
else{S.view='auth';render()}
})();
</script>
