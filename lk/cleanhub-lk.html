<div id="chlk" class="chlk"></div>

<style>
.chlk{
  /* Фирменные токены CleanHub (как в калькуляторе на сайте): зелёный #00B14F, тёмно-зелёный #0B2517 */

  box-sizing:border-box;max-width:1040px;margin:0 auto;-webkit-font-smoothing:antialiased;
}

.chlk h1,.chlk h2,.chlk h3,.chlk p{margin:0}
.chlk a:not(.k-btn){color:var(--k-acc-t)}

.k-shell{background:var(--k-bg);border-radius:24px;padding:20px}
.k-ic{flex:none;display:block}
.k-demo{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:13px;background:var(--k-warn-bg);color:var(--k-warn);padding:10px 14px;border-radius:12px;margin-bottom:16px}
.k-demo b{font-weight:700}
.k-demo .k-link{color:inherit}
.k-demo-btns{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.k-demo-btns button{background:rgba(255,255,255,.55);border:1px solid currentColor;border-radius:999px;padding:3px 11px;font-size:12.5px;color:inherit}
.k-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:30px;background:var(--k-acc);color:var(--k-acc-on);padding:14px 26px;font-weight:700;font-size:15px;text-decoration:none;transition:background .15s}

.k-link{background:none;border:0;padding:0;color:var(--k-acc-t);text-decoration:underline;text-underline-offset:3px;font-size:inherit}
.k-card{background:var(--k-card);border:1px solid var(--k-line);border-radius:24px;padding:22px;min-width:0}

/* auth */
.k-auth{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);background:var(--k-card);border:1px solid var(--k-line);border-radius:24px;overflow:hidden}

.k-empty{text-align:center;padding:32px 16px;display:flex;flex-direction:column;gap:12px;align-items:center}

.k-pref{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:12px 0;border-bottom:1px solid var(--k-line)}
.k-pref:last-child{border:0}
.k-addr{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 12px;border:1.5px solid var(--k-line);border-radius:12px}

<script>
(function(){
'use strict';
var root=document.getElementById('chlk');
if(!root||root.getAttribute('data-ready'))return;
root.setAttribute('data-ready','1');

/* ================= НАСТРОЙКИ ================= */
var CHLK_CONFIG=window.CHLK_CONFIG||{};
var C={
  mode:'demo',                          // 'demo' — тестовые данные; 'live' — работа с вашим сервером
  apiBase:'https://api.cleanhub24.ru/lk', // адрес вашего бэкенда (прокси к Тейке, CRM и Telegram-боту)
  telegramBot:'cleanhub24_bot',         // имя Telegram-бота без @
  // Услуги и цены для оформления заказа в кабинете. Цены демо: в боевом режиме сервер пересчитывает и подтверждает сумму.
  // unit: 'm2' — считаем по площади, иначе по количеству (qtyLabel — подпись поля).
  services:[
    {id:'support',name:'Поддерживающая уборка',unit:'m2',price:90,hint:'Считаем по площади'},
    {id:'general',name:'Генеральная уборка',unit:'m2',price:165,hint:'Считаем по площади'},
    {id:'repair',name:'Уборка после ремонта',unit:'m2',price:245,hint:'Считаем по площади'},
    {id:'windows',name:'Мытьё окон',unit:'pcs',price:500,qtyLabel:'Количество окон',def:4,hint:'Считаем по числу окон'},
    {id:'sofa',name:'Химчистка дивана',unit:'pcs',price:1300,qtyLabel:'Количество мест',def:3,hint:'Считаем по числу мест'}
  ],
  extras:[{id:'fridge',name:'Мытьё холодильника',price:500},{id:'oven',name:'Мытьё духовки',price:800},{id:'balcony',name:'Уборка балкона',price:800}],
  slots:['09:00–11:00','11:00–13:00','13:00–15:00','15:00–17:00','17:00–19:00'],
  defaultArea:50,
  supportUrl:'https://t.me/cleanhub24_support',
  privacyUrl:'/privacy',
  welcomeBonus:300,
  referralBonus:500,
  telegramBonus:100,
  maxPayPercent:30,
  showDemoBar:true
};
for(var k in CHLK_CONFIG)C[k]=CHLK_CONFIG[k];

/* ================= УТИЛИТЫ ================= */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function digits(s){return String(s||'').replace(/\D/g,'')}
function fmtPhone(s){
  var d=digits(s);if(!d)return'';
  if(d[0]==='7'||d[0]==='8')d=d.slice(1);
  d=d.slice(0,10);
  var o='+7 ('+d.slice(0,3);
  if(d.length>=3)o+=')';
  if(d.length>3)o+=' '+d.slice(3,6);
  if(d.length>6)o+='-'+d.slice(6,8);
  if(d.length>8)o+='-'+d.slice(8,10);
  return o;
}
function phoneOk(s){var d=digits(s);if(d[0]==='7'||d[0]==='8')d=d.slice(1);return d.length===10}
function money(n){return Math.round(n).toLocaleString('ru-RU')+' ₽'}
function plural(n,f){n=Math.abs(n)%100;var m=n%10;return n>10&&n<20?f[2]:m>1&&m<5?f[1]:m===1?f[0]:f[2]}
function bonus(n){return Math.round(n).toLocaleString('ru-RU')+' '+plural(n,['бонус','бонуса','бонусов'])}
function dFmt(iso,long){var d=new Date(iso);return d.toLocaleDateString('ru-RU',long?{day:'numeric',month:'long',year:'numeric'}:{day:'numeric',month:'long'})}
var mem={};
var store={
  get:function(k){try{return localStorage.getItem(k)}catch(e){return mem[k]||null}},
  set:function(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}},
  del:function(k){try{localStorage.removeItem(k)}catch(e){delete mem[k]}}
};
function wait(v,ms){return new Promise(function(r){setTimeout(function(){r(v)},ms==null?350:ms)})}
function failP(m){return new Promise(function(_,rej){setTimeout(function(){rej(new Error(m))},350)})}

/* ================= РАСЧЁТ ЗАКАЗА ================= */
function svcById(id){for(var i=0;i<C.services.length;i++)if(C.services[i].id===id)return C.services[i];return C.services[0]}
function quoteCore(serviceId,qty,extraIds){
  var sv=svcById(serviceId),q=Math.max(0,Number(qty)||0),lines=[],total=0;
  var base=Math.round(sv.price*q);
  lines.push({name:sv.name+(sv.unit==='m2'?', '+q+'\u00A0м²':' × '+q),sum:base,item:{name:sv.name+(sv.unit==='m2'?', '+q+' м²':''),qty:sv.unit==='m2'?1:q,price:sv.unit==='m2'?base:sv.price}});
  total+=base;
  C.extras.forEach(function(x){if(extraIds&&extraIds.indexOf(x.id)>=0){lines.push({name:x.name,sum:x.price,item:{name:x.name,qty:1,price:x.price}});total+=x.price}});
  return{lines:lines,total:total,svc:sv,qty:q};
}

/* ================= API: БОЕВОЙ РЕЖИМ ================= */
function liveApi(){
  function req(path,method,body){
    var h={'Content-Type':'application/json'},t=store.get('chlk_token');
    if(t)h.Authorization='Bearer '+t;
    return fetch(C.apiBase+path,{method:method||'GET',headers:h,body:body?JSON.stringify(body):undefined,credentials:'omit'})
      .then(function(r){return r.json().catch(function(){return{}}).then(function(j){
        if(r.status===401&&path!=='/auth/verify'){store.del('chlk_token')}
        if(!r.ok)throw new Error(j.message||'Не удалось выполнить запрос. Попробуйте ещё раз.');
        return j;
      })});
  }
  return{
    sendCode:function(phone,purpose){return req('/auth/code','POST',{phone:phone,purpose:purpose})},
    verify:function(phone,code,reg){return req('/auth/verify','POST',{phone:phone,code:code,profile:reg||null})},
    me:function(){return req('/me')},
    orders:function(){return req('/orders').then(function(j){return j.orders||j})},
    updateProfile:function(p){return req('/me','PATCH',p)},
    createOrder:function(pl){return req('/orders','POST',pl).then(function(j){return j.order?j:{order:j}})},
    promo:function(code){return req('/loyalty/promo','POST',{code:code})},
    tgLink:function(){return req('/telegram/link','POST')},
    tgStatus:function(t){return req('/telegram/status?token='+encodeURIComponent(t))},
    tgUnlink:function(){return req('/telegram','DELETE')},
    tgAuthStart:function(){return req('/auth/telegram/start','POST')},
    tgAuthStatus:function(t){return req('/auth/telegram/status?token='+encodeURIComponent(t))},
    logout:function(){}
  };
}

function levelInfo(L){
  var cur=L.levels[0],next=null;
  for(var i=0;i<L.levels.length;i++){if(L.spent>=L.levels[i].from){cur=L.levels[i];next=L.levels[i+1]||null}}
  var pct=next?Math.min(100,Math.round((L.spent-cur.from)/(next.from-cur.from)*100)):100;
  return{cur:cur,next:next,pct:pct};
}

function isoDate(d){var m=d.getMonth()+1,dd=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(dd<10?'0':'')+dd}
function formDefaults(from){
  var u=S.user,area=C.defaultArea;
  S.orders.forEach(function(o){if(o.area&&area===C.defaultArea)area=o.area});
  var t=new Date();t.setDate(t.getDate()+1);
  S.lastArea=area;
  var f={service:'general',qty:area,extras:{},date:isoDate(t),slot:C.slots[1],comment:'',useBonus:false,bonus:0,
    addrId:u.addresses.length?u.addresses[0].id:'other',addrText:''};
  if(from){
    if(from.svc){f.service=from.svc;f.qty=from.qty||f.qty}
    if(from.slot&&C.slots.indexOf(from.slot)>=0)f.slot=from.slot;
    var m=u.addresses.filter(function(a){return a.text===from.address})[0];
    if(m)f.addrId=m.id;else{f.addrId='other';f.addrText=from.address||''}
  }
  return f;
}
function formQuote(){
  var f=S.form,ids=Object.keys(f.extras).filter(function(k){return f.extras[k]});
  var q=quoteCore(f.service,f.qty,ids),L=S.loy,li=levelInfo(L);
  q.maxBonus=Math.max(0,Math.min(L.balance,Math.floor(q.total*L.maxPay/100)));
  q.bonus=f.useBonus?Math.min(Math.max(0,Math.round(f.bonus)||0),q.maxBonus):0;
  q.pay=q.total-q.bonus;q.pct=li.cur.pct;q.earn=Math.round(q.pay*q.pct/100);q.extraIds=ids;
  return q;
}
function sumLinesHtml(q){return q.lines.map(function(l){return'<div class="k-line"><span>'+esc(l.name)+'</span><span class="k-num">'+money(l.sum)+'</span></div>'}).join('')}
function sumTotalHtml(q){
  return(q.bonus?'<div class="k-line"><span>Всего за услуги</span><span class="k-num">'+money(q.total)+'</span></div><div class="k-line"><span>Оплачено бонусами</span><span class="k-num k-plus">−'+money(q.bonus)+'</span></div>':'')+

    '<div class="k-earn">+'+bonus(q.earn)+' после выполнения · кешбэк '+q.pct+'%</div>';
}
function bonusInfoHtml(q){return'Спишем '+bonus(q.bonus)+' из '+bonus(q.maxBonus)+' возможных'}
function refreshForm(){
  var q=formQuote(),f=S.form;

  if(a)a.innerHTML=sumLinesHtml(q);
  if(b)b.innerHTML=sumTotalHtml(q);
  if(r){r.max=q.maxBonus;r.value=q.bonus}
  if(i)i.textContent=bonusInfoHtml(q);
  if(box)box.hidden=!f.useBonus||q.maxBonus<=0;

}

  var f=S.form;

  refreshForm();
}

  var f=S.form,q=formQuote(),u=S.user,err=root.querySelector('[data-ferr]');
  var addr=(!u.addresses.length||f.addrId==='other')?f.addrText.trim():(u.addresses.filter(function(a){return a.id===f.addrId})[0]||{}).text;
  var msg=!(q.qty>0)?'Укажите '+(q.svc.unit==='m2'?'площадь':'количество')+'.':!f.date?'Выберите дату.':!addr?'Укажите адрес.':'';
  if(msg){if(err){err.textContent=msg;err.hidden=false}return}
  if(err)err.hidden=true;
  var btn=root.querySelector('[data-act=submit-order]');if(btn){btn.disabled=true;btn.textContent='Оформляем…'}
  API.createOrder({service:f.service,qty:q.qty,extras:q.extraIds,address:addr,date:f.date,slot:f.slot,comment:f.comment.trim(),bonusSpend:q.bonus})
    .then(function(r){
      S.done=r.order;S.orders.unshift(r.order);
      return API.me().then(function(m){S.user=m.user;S.loy=m.loyalty;S.user.notify=S.user.notify||{tgOrders:true,tgPromo:false};S.user.addresses=S.user.addresses||[]});
    })
    .then(function(){render();root.scrollIntoView({behavior:'smooth',block:'start'})})
    .catch(function(e){if(btn){btn.disabled=false;btn.textContent='Оформить заказ'}if(err){err.textContent=(e&&e.message)||'Не удалось оформить заказ. Попробуйте ещё раз.';err.hidden=false}});
}

function appView(){
  var u=S.user;
  var tabs=[['overview','grid','Обзор'],['orders','bag','Заказы'],['bonuses','star','Бонусы'],['profile','user','Профиль']];
  var nav=tabs.map(function(t){return'<button role="tab" data-act="tab" data-v="'+t[0]+'" aria-selected="'+(S.tab===t[0])+'">'+ic(t[1],18)+t[2]+'</button>'}).join('');
  if(S.tab==='order'&&!S.form)S.form=formDefaults();
  var body={overview:overviewTab,orders:ordersTab,bonuses:bonusesTab,profile:profileTab,order:orderView}[S.tab]();
  return'<div class="k-top"><div class="k-hello"><h2>Здравствуйте'+(u.name?', '+esc(u.name):'')+'!</h2><p class="k-muted">'+esc(u.phone)+'</p></div>'+
    '<div class="k-row"><div class="k-tabs" role="tablist">'+nav+'</div><button class="k-btn k-new" data-act="new-order">'+ic('plus',18)+' Заказать уборку</button><button class="k-btn k-ghost k-out" data-act="logout" aria-label="Выйти" title="Выйти">'+ic('out',18)+'</button></div></div>'+body;
}

/* ================= ДЕЙСТВИЯ ================= */
function toast(msg,kind){
  var old=document.querySelector('.k-toast');if(old)old.remove();
  var t=document.createElement('div');t.className='k-toast'+(kind?' '+kind:'');t.setAttribute('role','status');t.textContent=msg;
  root.appendChild(t);setTimeout(function(){if(t.parentNode)t.remove()},2800);
}
function fail(e){
  S.busy=false;var m=(e&&e.message)||'Что-то пошло не так. Попробуйте ещё раз.';
  if(S.view==='auth'){S.err=m;render()}else{render();toast(m,'bad')}
}
function stopTimers(){clearInterval(T.poll);clearInterval(T.resend)}
function tickResend(restart){
  var el=root.querySelector('[data-resend]');if(!el)return;
  if(restart){clearInterval(T.resend);if(T.left<=0)T.left=30;
    T.resend=setInterval(function(){T.left--;tickResend(false);if(T.left<=0)clearInterval(T.resend)},1000)}
  var cur=root.querySelector('[data-resend]');if(!cur)return;
  cur.innerHTML=T.left>0?'Повторно отправить код можно через '+T.left+' с':'<button class="k-link" data-act="resend">Отправить код ещё раз</button>';
}
function enterApp(){
  S.busy=true;
  return Promise.all([API.me(),API.orders()]).then(function(r){
    S.user=r[0].user;S.loy=r[0].loyalty;S.orders=r[1]||[];S.user.notify=S.user.notify||{tgOrders:true,tgPromo:false};S.user.addresses=S.user.addresses||[];
    S.draft={name:S.user.name||'',email:S.user.email||'',birthday:S.user.birthday||''};
    S.view='app';S.tab='overview';S.busy=false;S.err='';S.step='form';S.tg=null;render();
  });
}
function sendCode(){
  var reg=S.authTab==='reg';S.err='';
  if(reg&&!S.name.trim()){S.err='Укажите, как к вам обращаться.';return render()}
  if(!phoneOk(S.phone)){S.err='Введите номер телефона полностью.';return render()}
  if(reg&&!S.agree){S.err='Нужно согласие на обработку персональных данных.';return render()}
  S.busy=true;render();
  API.sendCode(S.phone,reg?'register':'login').then(function(){S.busy=false;S.step='code';S.code='';T.left=30;S.focus='#chlk-code';render()}).catch(fail);
}
function verify(){
  if(S.code.length<4){S.err='Введите 4 цифры из SMS.';return render()}
  S.busy=true;S.err='';render();
  var reg=S.authTab==='reg'?{name:S.name.trim(),email:S.email.trim()}:null;
  API.verify(S.phone,S.code,reg).then(function(r){if(r&&r.token)store.set('chlk_token',r.token);return enterApp()}).catch(function(e){S.code='';S.focus='#chlk-code';fail(e)});
}
function startPoll(kind){
  clearInterval(T.poll);var n=0,tok=S.tg.token;
  T.poll=setInterval(function(){
    n++;if(n>150||!S.tg){clearInterval(T.poll);if(S.tg){S.tg=null;render()}return}
    (kind==='auth'?API.tgAuthStatus(tok):API.tgStatus(tok)).then(function(r){
      if(!S.tg)return;
      if(kind==='auth'&&r.done){clearInterval(T.poll);if(r.token)store.set('chlk_token',r.token);S.tg=null;enterApp()}
      if(kind==='link'&&r.connected){clearInterval(T.poll);S.tg=null;API.me().then(function(m){S.user=m.user;S.loy=m.loyalty;S.user.notify=S.user.notify||{tgOrders:true,tgPromo:false};render();toast('Telegram подключён')})}
    }).catch(function(){});
  },DEMO?1000:3000);
}
function logout(){stopTimers();API.logout();store.del('chlk_token');S={form:null,done:null,view:'auth',authTab:'login',step:'form',phone:'',name:'',email:'',agree:true,code:'',err:'',busy:false,tg:null,tab:'overview',filter:'all',open:{},user:null,loy:null,orders:[],draft:null,newAddr:'',promo:'',focus:null};render()}
function copy(v){
  var done=function(){toast('Скопировано')};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(v).then(done,function(){toast('Не удалось скопировать: '+v)});
  else toast(v);
}
function saveProfile(){
  S.busy=true;render();
  API.updateProfile({name:S.draft.name.trim(),email:S.draft.email.trim(),birthday:S.draft.birthday}).then(function(r){S.busy=false;if(r&&r.user)S.user=r.user;else{S.user.name=S.draft.name;S.user.email=S.draft.email}render();toast('Данные сохранены')}).catch(fail);
}

root.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el||!root.contains(el))return;
  var a=el.getAttribute('data-act'),v=el.getAttribute('data-v'),id=el.getAttribute('data-id');
  switch(a){
    case'auth-tab':S.authTab=v;S.err='';render();break;
    case'send-code':case'resend':sendCode();break;
    case'edit-phone':S.step='form';S.err='';clearInterval(T.resend);S.focus='#chlk-phone';render();break;
    case'verify':verify();break;
    case'tg-login':S.err='';API.tgAuthStart().then(function(r){S.tg={kind:'auth',url:r.url,token:r.token};render();startPoll('auth')}).catch(fail);break;
    case'tg-connect':S.busy=true;render();API.tgLink().then(function(r){S.busy=false;S.tg={kind:'link',url:r.url,token:r.token};render();startPoll('link')}).catch(fail);break;
    case'tg-cancel':clearInterval(T.poll);S.tg=null;render();break;
    case'tg-sim':API.demoConfirm(v);break;
    case'tg-unlink':API.tgUnlink().then(function(){S.user.tg={connected:false,username:''};render();toast('Telegram отключён')}).catch(fail);break;
    case'demo-quick':API.quick(v).then(enterApp).catch(fail);break;
    case'demo-reset':stopTimers();API.reset();S.view='auth';S.tg=null;render();break;
    case'tab':S.tab=v;if(v!=='order')S.done=null;render();break;
    case'new-order':S.done=null;S.form=formDefaults();S.tab='order';render();root.scrollIntoView({behavior:'smooth',block:'start'});break;
    case'repeat':var src=S.orders.filter(function(x){return x.id===id})[0];S.done=null;S.form=formDefaults(src);S.tab='order';render();root.scrollIntoView({behavior:'smooth',block:'start'});toast(src&&src.svc?'Данные прошлого заказа подставлены':'Выберите услугу и проверьте детали');break;
    case'pick-svc':var pv=svcById(S.form.service),ns=svcById(v);if(pv.id!==ns.id&&(pv.unit!==ns.unit||ns.unit!=='m2'))S.form.qty=ns.unit==='m2'?S.lastArea:(ns.def||1);S.form.service=v;render();break;
    case'submit-order':submitOrder();break;
    case'filter':S.filter=v;render();break;
    case'toggle-order':S.open[id]=!S.open[id];render();break;
    case'open-order':S.tab='orders';S.open[id]=true;render();break;
    case'copy':copy(v);break;
    case'save-profile':saveProfile();break;
    case'add-addr':
      if(!S.newAddr.trim()){toast('Введите адрес','bad');break}
      var list=S.user.addresses.concat([{id:'a'+Date.now(),label:'Адрес '+(S.user.addresses.length+1),text:S.newAddr.trim()}]);
      API.updateProfile({addresses:list}).then(function(r){S.user.addresses=(r&&r.user&&r.user.addresses)||list;S.newAddr='';render();toast('Адрес добавлен')}).catch(fail);break;
    case'del-addr':
      var rest=S.user.addresses.filter(function(x){return x.id!==id});
      API.updateProfile({addresses:rest}).then(function(r){S.user.addresses=(r&&r.user&&r.user.addresses)||rest;render()}).catch(fail);break;
    case'promo':
      if(!S.promo.trim()){toast('Введите промокод','bad');break}
      S.busy=true;render();
      API.promo(S.promo).then(function(){S.promo='';return API.me()}).then(function(m){S.busy=false;S.user=m.user;S.loy=m.loyalty;render();toast('Промокод применён, бонусы начислены')}).catch(fail);break;
    case'logout':logout();break;
  }
});
root.addEventListener('input',function(e){
  var el=e.target,b=el.getAttribute&&el.getAttribute('data-bind');if(!b)return;
  if(b.indexOf('f.ex.')===0){S.form.extras[b.slice(5)]=el.checked;refreshForm();return}
  if(el.type==='checkbox'){if(b.indexOf('f.')===0){S.form[b.slice(2)]=el.checked;onFormChange(b)}else S[b]=el.checked;return}
  var val=el.value;
  if(b==='f.qty'||b==='f.bonus')val=Number(val)||0;
  if(b==='phone'){val=fmtPhone(val);el.value=val}
  if(b==='code'){val=digits(val).slice(0,4);el.value=val}
  if(b.indexOf('f.')===0){S.form[b.slice(2)]=val;onFormChange(b);return}
  if(b.indexOf('d.')===0)S.draft[b.slice(2)]=val;else S[b]=val;
  if(b==='code'&&val.length===4&&!S.busy)verify();
});
root.addEventListener('change',function(e){
  var el=e.target,k=el.getAttribute&&el.getAttribute('data-sw');if(!k)return;
  S.user.notify[k]=el.checked;
  API.updateProfile({notify:S.user.notify}).then(function(){toast('Сохранено')}).catch(function(err){el.checked=!el.checked;S.user.notify[k]=el.checked;toast(err.message,'bad')});
});
root.addEventListener('keydown',function(e){
  if(e.key!=='Enter'||e.target.tagName!=='INPUT'||e.target.type==='checkbox')return;
  if(S.view==='auth'&&S.step==='form')sendCode();
  else if(S.view==='auth'&&S.step==='code')verify();
});

/* ================= СТАРТ ================= */
render();
if(store.get('chlk_token')){enterApp().catch(function(){store.del('chlk_token');S.view='auth';S.busy=false;render()})}
else{S.view='auth';render()}
})();
</script>
